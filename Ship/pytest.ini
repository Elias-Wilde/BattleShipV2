[pytest]
# Pytest configuration for BattleShip V2 tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test organization
markers =
    unit: Unit tests (test isolated functions/methods)
    integration: Integration tests (test API endpoints)
    e2e: End-to-end tests (full game flow)
    security: Security-related tests
    slow: Tests that take a long time to run

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Logging
log_cli = false
log_cli_level = INFO
log_file = test_results.log
log_file_level = DEBUG

# Timeout for tests (seconds)
timeout = 30
