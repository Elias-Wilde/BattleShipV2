name: CI/CD Pipeline

on:
  push:
    branches: [ secure, develop ]
  pull_request:
    branches: [ secure, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd Ship
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        cd Ship
        pytest tests/test_api.py -v --tb=short

    - name: Run code quality checks
      run: |
        cd Ship
        flake8 app --max-line-length=120 --exclude=migrations,venv
        black --check app tests --line-length=120
        isort --check-only app tests

    - name: Run security checks
      run: |
        cd Ship
        bandit -r app -ll -f json -o bandit-report.json || true
        safety check --json || true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: Ship/bandit-report.json

    - name: Comment PR with results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const banditReport = fs.existsSync('Ship/bandit-report.json')
            ? JSON.parse(fs.readFileSync('Ship/bandit-report.json', 'utf8'))
            : null;

          let comment = '## CI/CD Results\n\n';
          comment += '✅ Tests passed\n';
          comment += '✅ Code quality checks passed\n';
          if (banditReport && banditReport.metrics.total_issues > 0) {
            comment += `⚠️ Security: ${banditReport.metrics.total_issues} issues found\n`;
          } else {
            comment += '✅ Security checks passed\n';
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
